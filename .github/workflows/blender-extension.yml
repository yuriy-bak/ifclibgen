# Tests the core, builds the Blender add-on and publishes it as a Blender
# remote extension repository on GitHub Pages:
#   https://yuriy-bak.github.io/ifclibgen/index.json
# Blender: Preferences > Get Extensions > Repositories > + > Add Remote Repository.
# A new add-on version reaches users when `version` in blender_manifest.toml changes.
name: Blender extension

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ifcopenshell pyyaml numpy pytest
      - run: python -m pytest -q tests
      - run: python blender/build.py site --index "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

# Example family (made up, not a real product): round ceiling diffuser.
# Origin: centre of the face on the ceiling plane, face below Z=0, neck up.
manufacturer: Example
ifc: {class: IfcAirTerminalType, predefined: DIFFUSER}
name: "Example diffuser Ø{D}"
insertion: "centre, ceiling plane"
params:
  D: {doc: neck diameter, mm}
  neck_h: {doc: neck height, mm, default: 60}
derived:
  face: "D * 2 + 100"
styles:
  white: {rgb: [0.95, 0.95, 0.95]}
default_style: white
geometry:
  - revolve: {profile: [[0, -15], ["face/2", -15], ["face/2", -10], ["D/2 + 10", 0], [0, 0]]}
  - arc_ring: {r1: "face/2 - 20 - k*(face/2 - D/2 - 20)/3", z1: -14, r2: "D/2 + 5", z2: 0, wall: 1, shape: straight}
    repeat: {var: k, count: 3}
  - tube: {d: D, wall: 1, from: [0, 0, 0], to: [0, 0, neck_h]}
ports:
  - {name: Inlet, shape: round, d: D, at: [0, 0, neck_h], dir: [0, 0, 1], flow: SINK, system: supply}
psets:
  Pset_ManufacturerTypeInformation: {Manufacturer: Example, ModelLabel: EX-D}
